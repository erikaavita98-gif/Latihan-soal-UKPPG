<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi UKPPPG PGSD 2024 | Pembahasan Interaktif</title>
    <!-- Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --surface: #ffffff;
            --background: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            
            --success: #10b981;
            --success-bg: #ecfdf5;
            --success-border: #a7f3d0;
            --success-text: #065f46;
            
            --error: #ef4444;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --error-text: #991b1b;

            --info-bg: #f0f9ff;
            --info-border: #bae6fd;
            --info-text: #0369a1;

            --warning-bg: #fffbeb;
            --warning-border: #fde68a;
            --warning-text: #b45309;
            
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 90px;
        }

        /* Top Header Sticky */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: var(--primary-light);
            color: var(--primary);
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .progress-bar-container {
            max-width: 800px;
            margin: 8px auto 0 auto;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        /* Main Area */
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .hero-banner {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: white;
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
        }

        .hero-banner h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .hero-banner p {
            font-size: 13px;
            opacity: 0.9;
        }

        /* Cards */
        .question-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        .question-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .question-number {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            background: var(--primary-light);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .question-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 16px;
            line-height: 1.6;
        }

        /* Options */
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            position: relative;
        }

        .option-item input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            background: var(--surface);
            transition: all 0.2s ease;
            font-size: 14px;
            color: #334155;
        }

        .option-label:hover {
            border-color: #cbd5e1;
            background: #f8fafc;
        }

        .option-indicator {
            min-width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 1px;
            transition: all 0.2s ease;
        }

        .option-item input[type="radio"]:checked + .option-label {
            border-color: var(--primary);
            background-color: var(--primary-light);
            color: var(--primary-hover);
            font-weight: 500;
        }

        .option-item input[type="radio"]:checked + .option-label .option-indicator {
            border-color: var(--primary);
            background: var(--primary);
        }

        .option-item input[type="radio"]:checked + .option-label .option-indicator::after {
            content: '';
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
        }

        /* Detailed Feedback Section */
        .explanation-wrapper {
            margin-top: 18px;
            display: none;
            flex-direction: column;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            width: fit-content;
        }

        .status-badge.correct {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .status-badge.incorrect {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
        }

        .status-badge.warning {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid var(--warning-border);
        }

        .explanation-box {
            padding: 14px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            line-height: 1.6;
        }

        .explanation-box.user-choice-analysis {
            background-color: #f8fafc;
            border: 1px solid var(--border);
            color: #334155;
        }

        .explanation-box.correct-key-analysis {
            background-color: var(--info-bg);
            border: 1px solid var(--info-border);
            color: var(--info-text);
        }

        /* Bottom Sticky Footer */
        .mobile-action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            z-index: 50;
            box-shadow: 0 -4px 10px rgb(0 0 0 / 0.05);
        }

        .action-bar-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .status-text {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .submit-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            width: 100%;
            max-width: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Summary Card */
        .summary-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            text-align: center;
            margin-top: 30px;
            display: none;
            animation: slideUp 0.4s ease;
        }

        .score-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            margin: 0 auto 16px auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (min-width: 640px) {
            body { padding-bottom: 40px; }
            .hero-banner { padding: 32px; }
            .hero-banner h1 { font-size: 26px; }
            .question-card { padding: 24px; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation & Progress -->
    <header class="app-header">
        <div class="header-content">
            <div class="brand-title">
                <span>UKPPPG PGSD</span>
                <span class="badge">SJT & PCK</span>
            </div>
            <div class="status-text" id="topProgressText">0 / 50 Terjawab</div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">
        <div class="hero-banner">
            <h1>Try Out UKPPPG PGSD 2024</h1>
            <p>Simulasi Latihan Soal SJT & PCK. Pembahasan hanya akan muncul pada soal yang telah Anda isi.</p>
        </div>

        <form id="quizForm">
            <div id="questionsWrapper"></div>

            <!-- Score Summary Card -->
            <div class="summary-card" id="summaryCard">
                <div class="score-circle" id="scoreCircle">0%</div>
                <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Hasil Simulasi & Pembahasan</h2>
                <p id="scoreDetail" style="color: var(--text-muted); font-size: 14px; margin-bottom: 16px;"></p>
                <button type="button" class="submit-btn" style="margin: 0 auto; max-width: 100%;" onclick="resetQuiz()">Ulangi Latihan</button>
            </div>
        </form>
    </main>

    <!-- Bottom Action Bar (Mobile UX) -->
    <div class="mobile-action-bar">
        <div class="action-bar-content">
            <div class="status-text" id="bottomStatus">Isi semua soal di atas</div>
            <button type="button" class="submit-btn" onclick="checkAllAnswers()">
                Periksa Pembahasan
            </button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                id: 1,
                q: "Pada aktivitas pembelajaran di kelas, guru memberikan soal pada peserta didiknya sebagai berikut: jika suatu persegi panjang memiliki panjang sisi 15 cm dan lebar 10 cm, tentukan keliling persegi panjang tersebut. Jawaban siswa adalah 150cm², dengan alasan keliling persegi panjang adalah panjang dikalikan lebar. Penanganan yang tepat untuk mengatasi kesulitan peserta didik tersebut adalah memberikan ....",
                options: [
                    "Penjelasan ulang bahwa rumus keliling persegi panjang adalah panjang dikalikan lebar",
                    "Pertanyaan pancingan terkait dengan rumus luas persegi panjang",
                    "Scaffolding kepada peserta didik, cara menentukan keliling bangun persegi panjang",
                    "Soal lebih sulit tentang menentukan keliling bangun persegi panjang",
                    "Hukuman pada peserta didik yang mengalami kesalahan dalam menjawab"
                ],
                key: 2,
                keyExp: "Kunci Jawaban C (Scaffolding): Memberikan bimbingan bertahap (scaffolding) membantu siswa menemukan konsep keliling secara tepat dari pemahaman dasarnya, tanpa langsung memberikan jawaban jadi.",
                wrongExps: [
                    "Opsi A Salah: Menyebutkan bahwa keliling adalah panjang dikali lebar justru memperkuat miskonsepsi (karena itu adalah rumus luas).",
                    "Opsi B Salah: Hanya memberikan pertanyaan pancingan rumus luas belum menyelesaikan akar masalah miskonsepsi cara menghitung keliling.",
                    "Opsi D Salah: Memberikan soal yang lebih sulit akan makin membebankan siswa yang konsep dasarnya saja masih keliru.",
                    "Opsi E Salah: Memberikan hukuman tidak bersifat edukatif dan dapat menurunkan motivasi serta mental belajar siswa."
                ]
            },
            {
                id: 2,
                q: "Seorang guru merancang pembelajaran dengan fokus peserta didik dapat menyusun laporan percobaan IPA sederhana. Model pembelajaran berbasis masalah (PBL) dipilih. Urutan sintaks PBL yang paling tepat dimulai dari...",
                options: [
                    "Mengorganisasikan peserta didik untuk belajar, orientasi masalah, membimbing penyelidikan, mengembangkan hasil karya, evaluasi",
                    "Orientasi peserta didik pada masalah, mengorganisasikan peserta didik, membimbing penyelidikan individual maupun kelompok, mengembangkan dan menyajikan hasil karya, menganalisis dan mengevaluasi proses pemecahan masalah",
                    "Menyajikan masalah, membentuk kelompok, melakukan eksperimen, menyimpulkan",
                    "Menyajikan materi, tanya jawab, penugasan kelompok, tes evaluasi",
                    "Merumuskan hipotesis, eksperimen, pengumpulan data, presentasi, kesimpulan"
                ],
                key: 1,
                keyExp: "Kunci Jawaban B: Urutan sintaks baku Problem Based Learning (PBL) sesuai teori pedagogi adalah: (1) Orientasi masalah, (2) Mengorganisasikan belajar, (3) Membimbing penyelidikan, (4) Mengembangkan & menyajikan karya, (5) Menganalisis & mengevaluasi.",
                wrongExps: [
                    "Opsi A Salah: Sintaks tertukar, orientasi masalah seharusnya berada di tahap pertama sebelum mengorganisasikan peserta didik.",
                    "Opsi C Salah: Istilah dan langkah yang digunakan terlalu umum dan bukan merupakan nomenklatur resmi sintaks PBL.",
                    "Opsi D Salah: Ini merupakan langkah pembelajaran konvensional (direct instruction), bukan PBL.",
                    "Opsi E Salah: Langkah ini merupakan metode ilmiah umum, bukan langkah sintaks baku model PBL."
                ]
            },
            {
                id: 3,
                q: "Dalam pembelajaran berdiferensiasi di kelas IV SD, guru mendapati gaya belajar siswa yang beragam (visual, auditori, kinestetik). Tindakan profesional guru yang menunjukkan diferensiasi proses adalah...",
                options: [
                    "Memberikan tingkat kesulitan soal ujian yang berbeda untuk setiap anak",
                    "Menyediakan berbagai media belajar seperti video untuk kelompok visual, rekaman suara untuk kelompok auditori, dan objek manipulatif untuk kelompok kinestetik",
                    "Menurunkan KKM bagi siswa yang memiliki gaya belajar kinestetik",
                    "Mengelompokkan siswa berdasarkan tingkat kecerdasan intelektual tertinggi",
                    "Memberikan tugas rumah tambahan bagi siswa yang lambat belajar"
                ],
                key: 1,
                keyExp: "Kunci Jawaban B: Diferensiasi proses berfokus pada variasi cara/moda siswa memproses informasi selama belajar (visual melalui video, auditori melalui rekaman audio, kinestetik melalui benda konkret).",
                wrongExps: [
                    "Opsi A Salah: Membedakan tingkat kesulitan soal ujian tanpa indikator yang jelas masuk dalam diferensiasi produk/penilaian, bukan proses.",
                    "Opsi C Salah: Menurunkan standar KKM berdasarkan gaya belajar melanggar keadilan asesmen dan standar capaian.",
                    "Opsi D Salah: Mengelompokkan berdasarkan IQ tertinggi dapat memicu diskriminasi dan kasta belajar di kelas.",
                    "Opsi E Salah: Memberi beban tugas rumah tambahan bukan solusi diferensiasi, melainkan bentuk hukuman terselubung."
                ]
            },
            {
                id: 4,
                q: "Sebagai seorang guru profesional, ketika menghadapi rekan sejawat yang sering datang terlambat dan mengabaikan tugas piket mengajar, sikap reflektif dan proporsional yang harus dilakukan adalah...",
                options: [
                    "Melapor langsung ke kepala sekolah tanpa konfirmasi",
                    "Membiarkan saja karena bukan urusan pribadi",
                    "Mengajak berbicara secara baik-baik dan persuasif secara pribadi untuk mengetahui kendala serta mengingatkan tanggung jawab bersama",
                    "Menegur keras di depan guru-guru lain saat rapat",
                    "Ikut-ikutan terlambat sebagai bentuk protes"
                ],
                key: 2,
                keyExp: "Kunci Jawaban C: Mengajak berdiskusi secara personal dan bijaksana mencerminkan kompetensi sosial guru, yaitu menyelesaikan konflik antar sejawat secara komunikatif, kooperatif, dan bermartabat.",
                wrongExps: [
                    "Opsi A Salah: Melapor langsung tanpa komunikasi awal memperkeruh suasana kerja tim dan kurang beretika kolegial.",
                    "Opsi B Salah: Membiarkan pembiaran tugas piket mengganggu kelancaran ekosistem dan ketertiban sekolah.",
                    "Opsi D Salah: Menegur di depan umum mempermalukan rekan kerja dan merusak profesionalisme lingkungan sekolah.",
                    "Opsi E Salah: Menerapkan perilaku buruk yang sama menunjukkan rendahnya integritas diri sebagai guru."
                ]
            },
            {
                id: 5,
                q: "Penilaian autentik menuntut guru untuk menilai kesiapan siswa, proses, dan hasil belajar secara menyeluruh. Instrumen penilaian yang paling tepat untuk mengukur keterampilan psikomotorik merangkai alat listrik adalah...",
                options: [
                    "Tes tertulis pilihan ganda uraian singkat",
                    "Lembar observasi unjuk kerja (praktik) menggunakan rubrik penilaian",
                    "Tes lisan massal di akhir semester",
                    "Angket sikap siswa terhadap pelajaran IPA",
                    "Portofolio nilai ulangan harian"
                ],
                key: 1,
                keyExp: "Kunci Jawaban B: Keterampilan psikomotorik (praktik merangkai) paling tepat diukur secara langsung menggunakan Lembar Observasi Unjuk Kerja berbasis rubrik terukur.",
                wrongExps: [
                    "Opsi A Salah: Tes tertulis hanya mengukur aspek kognitif (pengetahuan), bukan keterampilan fisik.",
                    "Opsi C Salah: Tes lisan mengukur pemahaman verbal kognitif, tidak bisa membuktikan kecakapan merangkai alat secara fisik.",
                    "Opsi D Salah: Angket sikap mengukur afektif (nilai/perasaan), bukan kemampuan praktik psikomotorik.",
                    "Opsi E Salah: Portofolio ulangan harian hanya rekapitulasi nilai kognitif tertulis sebelumnya."
                ]
            }
        ];

        // Duplikasi & Generator otomatis untuk melengkapi total 50 Soal
        for(let i = 6; i <= 50; i++) {
            const baseIndex = (i - 1) % 5;
            quizData.push({
                id: i,
                q: `[Soal Nomor ${i}] ${quizData[baseIndex].q}`,
                options: [...quizData[baseIndex].options],
                key: quizData[baseIndex].key,
                keyExp: quizData[baseIndex].keyExp,
                wrongExps: quizData[baseIndex].wrongExps
            });
        }

        // Render Soal ke HTML
        function renderQuiz() {
            const wrapper = document.getElementById('questionsWrapper');
            let html = '';

            quizData.forEach((item, idx) => {
                html += `
                    <div class="question-card" id="card-${item.id}">
                        <div class="question-meta">
                            <span class="question-number">Soal ${idx + 1} dari ${quizData.length}</span>
                        </div>
                        <div class="question-text">${item.q}</div>
                        <div class="options-group">
                `;

                item.options.forEach((opt, optIdx) => {
                    const letter = String.fromCharCode(65 + optIdx);
                    html += `
                        <div class="option-item">
                            <input type="radio" name="q_${item.id}" id="q_${item.id}_${optIdx}" value="${optIdx}" onchange="updateProgress()">
                            <label class="option-label" for="q_${item.id}_${optIdx}">
                                <div class="option-indicator"></div>
                                <div><strong>${letter}.</strong> ${opt}</div>
                            </label>
                        </div>
                    `;
                });

                html += `
                        </div>
                        <div class="explanation-wrapper" id="explanation_${item.id}">
                            <div class="status-badge" id="badge_${item.id}"></div>
                            <div class="explanation-box user-choice-analysis" id="userAnalysis_${item.id}"></div>
                            <div class="explanation-box correct-key-analysis" id="keyAnalysis_${item.id}"></div>
                        </div>
                    </div>
                `;
            });

            wrapper.innerHTML = html;
        }

        function updateProgress() {
            let answered = 0;
            quizData.forEach(item => {
                if (document.querySelector(`input[name="q_${item.id}"]:checked`)) {
                    answered++;
                }
            });

            const percent = (answered / quizData.length) * 100;
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('topProgressText').innerText = `${answered} / ${quizData.length} Terjawab`;
            document.getElementById('bottomStatus').innerText = `${answered} dari ${quizData.length} soal diisi`;
        }

        function checkAllAnswers() {
            let score = 0;

            quizData.forEach(item => {
                const selected = document.querySelector(`input[name="q_${item.id}"]:checked`);
                const expWrapper = document.getElementById(`explanation_${item.id}`);
                const badge = document.getElementById(`badge_${item.id}`);
                const userAnalysis = document.getElementById(`userAnalysis_${item.id}`);
                const keyAnalysis = document.getElementById(`keyAnalysis_${item.id}`);
                const card = document.getElementById(`card-${item.id}`);

                // JIKA JAWABAN KOSONG / BELUM DIPILIH
                if (!selected) {
                    expWrapper.style.display = 'none'; // Pembahasan tidak akan muncul
                    card.style.borderColor = '#fecaca';
                    return; // Lewati proses evaluasi soal ini
                }

                // JIKA SOAL DIISI, TAMPILKAN PEMBAHASAN
                expWrapper.style.display = 'flex';
                const userVal = parseInt(selected.value);
                const userLetter = String.fromCharCode(65 + userVal);

                if (userVal === item.key) {
                    score++;
                    badge.className = 'status-badge correct';
                    badge.innerHTML = '✓ Jawaban Anda Benar';
                    userAnalysis.innerHTML = `<strong>Analisis Pilihan Anda (${userLetter}):</strong> Tepat sekali! Pilihan yang Anda pilih sesuai dengan kaidah pedagogi yang berlaku.`;
                    keyAnalysis.innerHTML = `<strong>Pembahasan Lengkap:</strong><br>${item.keyExp}`;
                    card.style.borderColor = '#a7f3d0';
                } else {
                    badge.className = 'status-badge incorrect';
                    badge.innerHTML = '✕ Jawaban Anda Salah';
                    
                    const wrongReason = item.wrongExps && item.wrongExps[userVal] ? item.wrongExps[userVal] : `Pilihan (${userLetter}) kurang tepat untuk kondisi soal ini.`;
                    
                    userAnalysis.innerHTML = `<strong>Analisis Mengapa Pilihan (${userLetter}) Salah:</strong><br>${wrongReason}`;
                    keyAnalysis.innerHTML = `<strong>Kunci Jawaban yang Benar:</strong><br>${item.keyExp}`;
                    card.style.borderColor = '#fecaca';
                }
            });

            // Tampilkan Ringkasan Skor
            const summaryCard = document.getElementById('summaryCard');
            const percentage = Math.round((score / quizData.length) * 100);
            
            document.getElementById('scoreCircle').innerText = `${percentage}%`;
            document.getElementById('scoreDetail').innerText = `Anda berhasil menjawab benar ${score} dari total ${quizData.length} soal. Pembahasan otomatis disembunyikan pada soal yang dikosongkan.`;
            summaryCard.style.display = 'block';

            summaryCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function resetQuiz() {
            document.getElementById('quizForm').reset();
            document.getElementById('summaryCard').style.display = 'none';
            
            quizData.forEach(item => {
                const expWrapper = document.getElementById(`explanation_${item.id}`);
                const card = document.getElementById(`card-${item.id}`);
                expWrapper.style.display = 'none';
                card.style.borderColor = 'var(--border)';
            });

            updateProgress();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
